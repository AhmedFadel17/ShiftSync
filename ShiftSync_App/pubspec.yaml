name: shiftsync_app
description: "ShiftSync – Employee Workforce & Shift Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & API
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.3.0

  # UI & UX
  intl: ^0.19.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
